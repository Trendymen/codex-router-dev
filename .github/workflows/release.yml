name: Release

"on":
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Audit removed runtimes
        run: node --test test/dependency-removal.test.mjs
      - name: Verify tag matches package version
        shell: bash
        run: |
          package_version=$(node -p 'require("./package.json").version')
          test "v$package_version" = "$GITHUB_REF_NAME"
          test "$(git rev-parse "$GITHUB_REF_NAME^{commit}")" = "$(git rev-parse HEAD)"
      - name: Build verified source package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          ./scripts/package-release.sh --output "$GITHUB_WORKSPACE/dist"
          node --input-type=module - <<'NODE'
          import { readFileSync } from "node:fs";
          import process from "node:process";
          const manifest = JSON.parse(readFileSync("dist/manifest.json", "utf8"));
          const head = process.env.GITHUB_SHA;
          if (manifest.sourceCommit !== head) throw new Error(`manifest sourceCommit ${manifest.sourceCommit} != ${head}`);
          if (`v${manifest.packageVersion}` !== process.env.GITHUB_REF_NAME) throw new Error("manifest package version does not match tag");
          if (!manifest.files?.length) throw new Error("manifest contains no files");
          NODE
          sha256sum -c <(sed 's#  #  dist/#' dist/SHA256SUMS)
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: "dist/*"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
