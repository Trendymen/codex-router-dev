name: CI

"on":
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - name: Audit removed runtimes
        run: node --test test/dependency-removal.test.mjs
      - name: Test the macOS tray
        if: runner.os == 'macOS'
        working-directory: apps/macos/ModelRouterTray
        run: swift test
      - name: Check shell syntax
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          for file in install.sh bin/* scripts/*.sh packaging/homebrew/*.sh; do
            [ "$(head -n 1 "$file")" != '#!/bin/sh' ] || sh -n "$file"
          done
      - name: Check installer help
        if: runner.os != 'Windows'
        run: ./install.sh --help
      - name: Parse PowerShell shims
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($file in @("install.ps1", "codex-router.ps1", "model-router.ps1")) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$null,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
          }

  homebrew-formula:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@8f3d1ec8a696b3b9d9a6c3696b6c73033cab69e4 # 2026.08.14.1
      - name: Audit the Node-only formula
        run: packaging/homebrew/check-core-readiness.sh
